version: 2

updates:
  - cooldown:
      default-days: 7
      include:
        - '*'
    directory: '/'
    groups:
      actions:
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
      - 'github-actions'
    package-ecosystem: 'github-actions'
    schedule:
      day: saturday
      interval: weekly
      time: '07:00'
      timezone: Etc/UTC
