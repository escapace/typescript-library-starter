allowBuilds:
  esbuild: true
  lefthook: true
blockExoticSubdeps: true
childConcurrency: 1
dedupePeers: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@caslon/*'
  - '@cassiopeia/*'
  - '@cepheus/*'
  - '@escapace/*'
  - '@pangram/*'
  - '@pointe/*'
  - '@types/node'
  - caslon
  - cassiopeia
  - cepheus
  - coastal
  - eslint-config-escapace
  - esroll
  - fastify-fetch
  - pointe
  - prettier-config-escapace
  - seedpods
  - snaproll
  - syncpack
  - syncpack-darwin-arm64
  - syncpack-darwin-x64
  - syncpack-linux-arm64
  - syncpack-linux-arm64-musl
  - syncpack-linux-x64
  - syncpack-linux-x64-musl
  - syncpack-windows-arm64
  - syncpack-windows-x64
  - typescript
minimumReleaseAgeStrict: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@eslint/*'
  - eslint
  - tinyexec@1.2.1
  - tinyexec@1.2.2
  - ts-api-utils@2.3.0
verifyDepsBeforeRun: false
